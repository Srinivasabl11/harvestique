# Render Blueprint: the Harvestique API on Render's free web service (Docker, Singapore).
# The database is NOT on Render (free Render Postgres is deleted after 30 days); it is a free Neon Postgres project.
# No secret is stored here: values marked `sync: false` are typed into the Render dashboard when the Blueprint is
# created, and JWT_SECRET_KEY is generated by Render once. Full steps: docs/DEPLOYMENT.md.
services:
  - type: web
    name: harvestique-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/live
    # Several people/agents push to main; deploy only on purpose (dashboard "Manual Deploy" or the deploy hook).
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      # The Android app is not a browser, so it needs no CORS; no web origin may call the API with a user's token.
      - key: CORS_ORIGINS
        value: "[]"
      - key: DATABASE_URL # Neon connection string (direct, not "-pooler"), with ?sslmode=require
        sync: false
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: JWT_SECRET_KEY
        generateValue: true
      # Sign-in is phone + password (no SMS codes). New sign-ups wait until an admin approves them (admin app >
      # Testers), which is how a tester's identity is checked; forgotten passwords are reset there too (temporary
      # password). Existing accounts keep their access. Do NOT set "approved" here: with password-only sign-in,
      # open sign-up would let anyone use the app.
      - key: NEW_ACCOUNT_ACCESS
        value: pending
      - key: WEATHER_PROVIDER
        value: open_meteo
      - key: MARKET_PRICE_PROVIDER # set to data_gov_in and add DATA_GOV_IN_API_KEY for live mandi prices
        value: disabled
      # AI assistant + crop-photo check: Ollama Cloud (same API as local Ollama). Without a key both degrade to the
      # non-AI paths (tool answers, colour measurements) and say so; nothing breaks.
      - key: LLM_PROVIDER
        value: ollama
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_MODEL
        value: gemma4:31b
      - key: CROP_HEALTH_CLASSIFIER
        value: ollama_vision
      - key: OLLAMA_VISION_MODEL
        value: gemma4:31b
      - key: LLM_TIMEOUT_SECONDS
        value: "60"
      - key: VISION_TIMEOUT_SECONDS
        value: "90"
