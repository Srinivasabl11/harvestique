name: harvestique
description: Harvestique - predictive harvest pooling for farmers and buyers.
publish_to: "none"
version: 0.6.0+6

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2 # access/refresh tokens (Android Keystore-backed)
  shared_preferences: ^2.3.3 # basic offline cache of the last successful reads
  speech_to_text: ^7.0.0 # on-device speech recognition (en-IN, kn-IN)
  flutter_tts: ^4.2.0 # on-device text-to-speech (en-IN, kn-IN)
  image_picker: ^1.1.2 # crop-health photos (camera or gallery)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/seedling_hero.jpg # brand photo: Home hero (frontend/branding/generate_brand_images.py)
    - assets/images/seedling_logo.png # brand photo, round: sign-in screen
